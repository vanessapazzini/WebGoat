# ============================================================
#  SCA Scan (Syft + Dependency-Track) — GitHub Actions
#  DT Evernow: https://sca.evn-viv.cc/
#
#  Secret necessário:
#    DEPENDENCY_TRACK_TOKEN
# ============================================================

name: SCA Scan (Dependency-Track)

on:
  workflow_call:
    inputs:
      appVersion:
        type: string
        default: "DevSecOps"

      repositoryName:
        type: string
        default: ""

      skipSecurityGate:
        type: boolean
        default: false

    secrets:
      DEPENDENCY_TRACK_TOKEN:
        required: true

env:
  DT_SCA_ENDPOINT: "https://sca.evn-viv.cc/api"
  DT_FRONTEND_URL: "https://sca.evn-viv.cc"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sca-scan:
    runs-on: ubuntu-latest

    steps:

      # ── Banner ─────────────────────────────
      - name: About the Job
        run: |
          echo "=================================================================="
          echo "  SCA Scan — Syft + Dependency-Track Evernow"
          echo "  Repositorio : ${{ inputs.repositoryName || github.event.repository.name }}"
          echo "  Versao DT   : ${{ inputs.appVersion }}"
          echo "  Branch      : ${{ github.ref_name }}"
          echo "=================================================================="

      # ── Checkout ────────────────────────────
      - name: Checkout source
        uses: actions/checkout@v4

      # ── Dependências ────────────────────────
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl python3

      # ── Variáveis ───────────────────────────
      - name: Set SCA Variables
        run: |
          REPO_NAME="${{ inputs.repositoryName || github.event.repository.name }}"
          echo "DT_APP_DEFAULT_NAME=${REPO_NAME}" >> "$GITHUB_ENV"
          echo "DT_APP_DEFAULT_VERSION=${{ inputs.appVersion }}" >> "$GITHUB_ENV"

      # ── Instalar Syft ───────────────────────
      - name: Install Syft
        run: |
          if ! command -v syft &>/dev/null; then
            curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin v1.19.0
          else
            echo "Syft $(syft version | head -1)"
          fi

      # ── Gerar SBOM ──────────────────────────
      - name: Generate SBOM
        run: |
          syft dir:${{ github.workspace }} -o cyclonedx-json=cyclonedx_report.json

          if [ ! -f cyclonedx_report.json ]; then
            echo "::error::SBOM nao gerado"
            exit 1
          fi

          echo "SBOM gerado:"
          jq '.components | length' cyclonedx_report.json

      # ── Upload SBOM ─────────────────────────
      - name: Upload SBOM to Dependency-Track
        run: |
          BOMCONTENT=$(base64 -w 0 cyclonedx_report.json)

          PAYLOAD=$(jq -n \
            --arg name "${DT_APP_DEFAULT_NAME}" \
            --arg ver  "${DT_APP_DEFAULT_VERSION}" \
            --arg bom  "${BOMCONTENT}" \
            '{"projectName":$name,"projectVersion":$ver,"autoCreate":true,"bom":$bom}')

          HTTP=$(curl -s -o /tmp/dt_resp.json -w "%{http_code}" \
            -X PUT "${DT_SCA_ENDPOINT}/v1/bom" \
            -H "X-API-Key: ${{ secrets.DEPENDENCY_TRACK_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "${PAYLOAD}")

          echo "DT upload HTTP ${HTTP}"

          if [ "$HTTP" != "200" ]; then
            echo "::error::Falha upload DT"
            cat /tmp/dt_resp.json
            exit 1
          fi

          TOKEN=$(jq -r '.token' /tmp/dt_resp.json)
          echo "SBOM_TOKEN=${TOKEN}" >> "$GITHUB_ENV"

      # ── Esperar processamento ───────────────
      - name: Wait for DT Processing
        run: |
          echo "Aguardando processamento..."

          for i in $(seq 1 25); do
            RESP=$(curl -sf "${DT_SCA_ENDPOINT}/v1/event/token/${SBOM_TOKEN}" \
              -H "X-API-Key: ${{ secrets.DEPENDENCY_TRACK_TOKEN }}")

            if [ "$(echo "$RESP" | jq -r '.processing')" = "false" ]; then
              break
            fi

            echo "Tentativa ${i}/25..."
            sleep 15
          done

          ENC=$(python3 -c "import urllib.parse; print(urllib.parse.quote('${DT_APP_DEFAULT_NAME}', safe=''))")

          PROJ=$(curl -sf "${DT_SCA_ENDPOINT}/v1/project/lookup?name=${ENC}&version=${DT_APP_DEFAULT_VERSION}" \
            -H "X-API-Key: ${{ secrets.DEPENDENCY_TRACK_TOKEN }}")

          ID=$(echo "$PROJ" | jq -r '.uuid')
          echo "DT_PROJECT_ID=${ID}" >> "$GITHUB_ENV"

      # ── Summary ─────────────────────────────
      - name: Dependency-Track Summary
        if: always()
        run: |
          METRICS=$(curl -s "${DT_SCA_ENDPOINT}/v1/metrics/project/${DT_PROJECT_ID}/current" \
            -H "X-API-Key: ${{ secrets.DEPENDENCY_TRACK_TOKEN }}")

          TOTAL=$(echo "$METRICS" | jq -r '.vulnerabilities // 0')

          echo "Total de vulnerabilidades: ${TOTAL}"

      # ── Security Gate ───────────────────────
      - name: Security Gate
        if: ${{ !inputs.skipSecurityGate }}
        run: |
          RESP=$(curl -sf \
            "${DT_SCA_ENDPOINT}/v1/violation/project/${DT_PROJECT_ID}" \
            -H "X-API-Key: ${{ secrets.DEPENDENCY_TRACK_TOKEN }}")

          COUNT=$(echo "$RESP" | jq 'length')

          if [ "$COUNT" -gt 0 ]; then
            echo "Falha no Security Gate!"
            exit 1
          fi

      # ── Artifact SBOM ───────────────────────
      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: cyclonedx_report.json

      # ── Artifact Violations ─────────────────
      - name: Upload Violations
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sca-violations
          path: /tmp/dt_resp.json
          if-no-files-found: ignore
